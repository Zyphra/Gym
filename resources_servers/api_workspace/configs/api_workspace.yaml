api_workspace_resources:
  resources_servers:
    api_workspace:
      entrypoint: app.py
      domain: agent
      verified: false
      description: Independently authored fictional multi-vendor SaaS workflows with final-state grading
      num_workers: 1
api_workspace_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server: {type: resources_servers, name: api_workspace_resources}
      model_server: {type: responses_api_models, name: policy_model}
      max_steps: 50
      datasets:
        - name: authored_train
          type: train
          jsonl_fpath: resources_servers/api_workspace/data/example.jsonl
          license: Apache 2.0
        - name: example
          type: example
          jsonl_fpath: resources_servers/api_workspace/data/example.jsonl
api_workspace_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server: {type: responses_api_agents, name: api_workspace_agent}
ray_startup: {enabled: false}
