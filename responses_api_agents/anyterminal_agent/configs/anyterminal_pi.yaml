anyterminal_pi:
  responses_api_agents:
    anyterminal_agent:
      entrypoint: app.py
      domain: coding
      description: Terminal task run by Pi inside the task container.
      value: Evaluate terminal-task capabilities on Terminal Bench with any Gym agent.

      agent_server_module: responses_api_agents.pi_agent.app
      agent_server_class: PiAgent
      agent_config_class: PiAgentConfig
      agent_kwargs:
        model: model
        workspace_root: /tmp/pi-agent
        thinking: high
        timeout: 3600
        pi_version: 0.80.2
        models_config: {}

      container_formatter: "docker://{docker_image}"
      concurrency: 6

      model_server:
        name: policy_model
        type: responses_api_models

      datasets:
        - name: example
          type: example
          jsonl_fpath: responses_api_agents/anyterminal_agent/data/terminal_bench.jsonl
